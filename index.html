<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Buat kolase huruf ala potongan majalah dan unduh hasilnya sebagai SVG.">
<title>Cut & Shuffle — Ransom Note Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5efdf;color:#211c19;font:16px system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:36px 24px}.eyebrow{font:bold 12px monospace;letter-spacing:.17em;color:#a12822}h1{font:bold clamp(46px,9vw,100px)/.94 Georgia;margin:12px 0;letter-spacing:-.07em}header p{margin:16px 0 32px}.grid{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:20px}.controls,.stage{border:2px solid #211c19;box-shadow:5px 5px #211c19}.controls{padding:18px;background:#fffbef}.stage{min-height:420px;background:#dcd5c8;display:grid;place-items:center;padding:20px;overflow:hidden}.stage svg{width:100%;height:auto;max-height:65vh;display:block}label{display:block;font-weight:700;margin:0 0 10px}textarea,select,button{font:inherit}textarea,select{width:100%;padding:9px;border:1px solid #211c19;background:#fffdf6;color:inherit;margin-top:5px}textarea{resize:vertical;min-height:78px}input[type=range]{display:block;width:100%;accent-color:#a12822}output{float:right;font:14px monospace}button{width:100%;padding:10px;cursor:pointer;border:2px solid #211c19;background:#ffcf51;color:#211c19;font-weight:800;margin-top:8px}button+button{background:#fffbef}button:hover{filter:brightness(.92)}:focus-visible{outline:3px solid #125db4;outline-offset:3px}footer{margin-top:22px;color:#51453c;font-size:13px}@media(max-width:720px){main{padding:22px 16px}.grid{grid-template-columns:1fr}.stage{min-height:245px;grid-row:1}}
</style>
<main>
<header><div class="eyebrow">STUDIO POTONGAN MAJALAH</div><h1>Cut &amp; Shuffle</h1><p>Ubah teks jadi kolase huruf. Acak sampai ketemu susunan yang kamu suka.</p></header>
<div class="grid">
<section class="controls" aria-label="Pengaturan kolase">
<label>Teks<textarea id="note" maxlength="150" rows="2">RANSOM
NOTES</textarea></label>
<label>Palet<select id="palette"><option value="vintage">Vintage Magazine</option><option value="pop">Bright Pop</option><option value="news">Newsprint</option></select></label>
<label>Kemiringan <output id="tiltValue"></output><input id="tilt" type="range" min="0" max="32" value="13"></label>
<label>Tepi sobekan <output id="roughValue"></output><input id="rough" type="range" min="0" max="100" value="65"></label>
<label>Spasi <output id="gapValue"></output><input id="gap" type="range" min="-20" max="35" value="-4"></label>
<label><input id="grain" type="checkbox" checked> Tekstur kertas</label>
<label><input id="mixed" type="checkbox"> Campur huruf besar dan kecil</label>
<button id="shuffle" type="button">Acak lagi ↻</button>
<button id="download" type="button">Unduh SVG ↓</button>
<button id="downloadPng" type="button">Unduh PNG ↓</button>
<div id="exportStatus" role="status"></div>
</section>
<section class="stage" id="stage" aria-label="Preview kolase"></section>
</div>
<footer>Hasil SVG berlatar transparan. Font di SVG mengikuti font yang tersedia di perangkat pembuka.</footer>
</main>
<script>
const el = id => document.getElementById(id);
const palettes = {vintage:['#eddbbf','#1d263b','#a93128','#285694','#f0a825','#28786d','#592843','#dc6945'],pop:['#da186d','#702fbd','#075fc6','#168149','#f2ad29','#d32e32','#fff0c4'],news:['#e3d7bf','#c8b69b','#f9efd7','#2d2720','#645549','#b4a38c']};
const fonts = ['Georgia','Impact','Arial Black','Courier New','Times New Roman','Trebuchet MS','Verdana','Palatino Linotype'];
const ns = 'http://www.w3.org/2000/svg';
const canvas = document.createElement('canvas').getContext('2d');
let seed = 1;
let currentSvg;
function node(name, attributes, parent) {
  const item = document.createElementNS(ns, name);
  for (const [key,value] of Object.entries(attributes)) item.setAttribute(key,value);
  if (parent) parent.append(item);
  return item;
}
function draw() {
  let state = seed;
  const random = () => ((state = (Math.imul(1664525,state)+1013904223)>>>0)/4294967296);
  const range = (a,b) => a+(b-a)*random();
  const palette = palettes[el('palette').value];
  const tilt = Number(el('tilt').value), rough = Number(el('rough').value), gap = Number(el('gap').value);
  el('tiltValue').value = tilt+'°';
  el('roughValue').value = rough+'%';
  el('gapValue').value = gap+'%';
  const input = el('note').value;
  const svg = node('svg',{'role':'img','aria-label':input || 'Preview kosong'});
  const rows = [];
  let y = 0, width = 0, previousFont = -1, previousColor = -1;
  for (const line of input.split(/\r?\n/)) {
    if (!line.trim()) { y += 42; continue; }
    const row = node('g',{},svg);
    let x = 0;
    for (const original of line.trim()) {
      if (/\s/u.test(original)) { x += 27; continue; }
      const glyph = el('mixed').checked && random()<.4 ? original.toLowerCase() : original;
      const fontIndex = (previousFont+1+Math.floor(random()*(fonts.length-1)))%fonts.length;
      const colorIndex = (previousColor+1+Math.floor(random()*(palette.length-1)))%palette.length;
      previousFont = fontIndex; previousColor = colorIndex;
      const font = fonts[fontIndex], paper = palette[colorIndex];
      const size = range(53,77), italic = random()<.24;
      canvas.font = (italic?'italic ':'')+'bold '+size+'px "'+font+'"';
      const metrics = canvas.measureText(glyph);
      const asc = metrics.actualBoundingBoxAscent || size*.64, desc = metrics.actualBoundingBoxDescent || 0;
      const left = metrics.actualBoundingBoxLeft || 0, right = metrics.actualBoundingBoxRight || metrics.width;
      const w = Math.max(34,left+right+range(15,29)), h = Math.max(range(61,80),asc+desc+17);
      const angle = range(-tilt,tilt), rad = angle*Math.PI/180;
      const span = w*Math.cos(rad)+h*Math.abs(Math.sin(rad));
      const g = node('g',{transform:'translate('+(x+span/2)+' '+range(-6,6)+') rotate('+angle+')'},row);
      const corners = [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]];
      const points = corners.flatMap(([ax,ay],i)=>{
        const [bx,by] = corners[(i+1)%4], count = rough ? Math.ceil(Math.hypot(bx-ax,by-ay)/7) : 1;
        return Array.from({length:count},(_,j)=>{
          const t = j/count, offset = j ? range(-3,3)*rough/100 : 0;
          return (ax+(bx-ax)*t+(i%2?offset:0)).toFixed(2)+','+(ay+(by-ay)*t+(i%2?0:offset)).toFixed(2);
        });
      }).join(' ');
      node('polygon',{points,fill:'#211c19',opacity:.23,transform:'translate(3 4)'},g);
      node('polygon',{points,fill:paper},g);
      for(let i=0;i<38;i++){
        const cx=range(-w*.43,w*.43), cy=range(-h*.43,h*.43), radius=range(.28,1.15);
        if(el('grain').checked) node('circle',{cx,cy,r:radius,fill:i%2?'#fff':'#211c19',opacity:.21},g);
      }
      const rgb = paper.slice(1).match(/../g).map(x=>parseInt(x,16));
      const ink = .299*rgb[0]+.587*rgb[1]+.114*rgb[2]>145 ? '#221a23' : '#fff5db';
      node('text',{x:(left-right)/2,y:(asc-desc)/2,'font-family':font,'font-size':size,'font-weight':'bold','font-style':italic?'italic':'normal',fill:ink},g).textContent=glyph;
      x += span+gap*.7;
    }
    rows.push({row,x,y}); width=Math.max(x,width); y+=105;
  }
  for(const {row,x,y} of rows) row.setAttribute('transform','translate('+((width-x)/2)+' '+y+')');
  el('stage').replaceChildren(svg);
  if(rows.length){
    const box = svg.getBBox();
    svg.setAttribute('viewBox',[box.x-12,box.y-12,box.width+24,box.height+24].join(' '));
    svg.setAttribute('width',Math.ceil(box.width+24));
    svg.setAttribute('height',Math.ceil(box.height+24));
  } else {
    svg.setAttribute('viewBox','0 0 400 200');
    node('text',{x:200,y:105,'text-anchor':'middle',fill:'#51453c'},svg).textContent='Ketik teks untuk mulai';
  }
  currentSvg=rows.length?svg:null;
  el('download').disabled=!currentSvg;
  el('downloadPng').disabled=!currentSvg;
}
function shuffle() {
  seed=crypto.getRandomValues(new Uint32Array(1))[0];
  draw();
}
for(const id of ['note','palette','tilt','rough','gap','grain','mixed']) el(id).addEventListener('input',draw);
el('shuffle').addEventListener('click',shuffle);
function download(blob, filename) {
  const url=URL.createObjectURL(blob);
  const link=document.createElement('a');
  link.href=url; link.download=filename; link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function svgBlob() {
  return new Blob([new XMLSerializer().serializeToString(currentSvg)],{type:'image/svg+xml;charset=utf-8'});
}
el('download').addEventListener('click',()=>{
  if(currentSvg) download(svgBlob(),'ransom-note.svg');
});
el('downloadPng').addEventListener('click',async ()=>{
  if(!currentSvg)return;
  const status=el('exportStatus');
  status.textContent='';
  const url=URL.createObjectURL(svgBlob());
  try {
    const image=new Image();
    image.src=url;
    await image.decode();
    const scale=Math.min(3,8192/Math.max(image.naturalWidth,image.naturalHeight));
    const bitmap=document.createElement('canvas');
    bitmap.width=Math.max(1,Math.round(image.naturalWidth*scale));
    bitmap.height=Math.max(1,Math.round(image.naturalHeight*scale));
    bitmap.getContext('2d').drawImage(image,0,0,bitmap.width,bitmap.height);
    const png=await new Promise(resolve=>bitmap.toBlob(resolve,'image/png'));
    if(!png)throw new Error('PNG encoding failed');
    download(png,'ransom-note.png');
  } catch (error) {
    status.textContent='PNG gagal dibuat. Coba unduh lagi.';
  } finally {
    URL.revokeObjectURL(url);
  }
});
shuffle();
</script>
